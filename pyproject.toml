[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tilde-gaia"
version = "1.0.0"
description = "Detection and time-delay estimation for Gaia gravitational-lens light curves"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "scipy>=1.11,<2",
  "matplotlib>=3.8,<4",
  "joblib>=1.3,<2",
  "scikit-learn>=1.7,<2",
]

[project.optional-dependencies]
ml = ["torch>=2.5,<3", "sktime>=0.38,<1"]
notebooks = ["jupyterlab>=4,<5", "ipykernel>=6,<8"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "nbformat>=5.10,<6"]
all = [
  "torch>=2.5,<3",
  "sktime>=0.38,<1",
  "jupyterlab>=4,<5",
  "ipykernel>=6,<8",
]

[tool.setuptools.packages.find]
include = ["Utility*"]

[tool.setuptools.data-files]
configs = [
  "configs/time_delay_profiles.json",
  "configs/time_delay_system_pairs.csv",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]
